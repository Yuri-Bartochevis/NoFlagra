services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: noflagra
      POSTGRES_PASSWORD: noflagra
      POSTGRES_DB: noflagra
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://noflagra:noflagra@db:5432/noflagra
    depends_on:
      - db

volumes:
  db-data:
