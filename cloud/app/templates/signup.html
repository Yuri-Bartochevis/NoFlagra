{% extends "base.html" %}
{% block title %}Start your gym — NO FLAGRA{% endblock %}
{% block content %}
<form class="card" method="post">
  <h1>Start your gym</h1>

  <label for="gym_name">Gym name</label>
  <input id="gym_name" name="gym_name" type="text" value="{{ gym_name or '' }}" required autofocus>

  <label for="name">Your name</label>
  <input id="name" name="name" type="text" value="{{ name or '' }}" required>

  <label for="email">Email</label>
  <input id="email" name="email" type="email" value="{{ email or '' }}" required>

  <label for="password">Password</label>
  <input id="password" name="password" type="password" minlength="8" required>

  <button class="btn btn-primary" type="submit">Create account</button>

  <p class="hint">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</form>
{% endblock %}
