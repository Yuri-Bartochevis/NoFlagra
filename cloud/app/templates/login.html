{% extends "base.html" %}
{% block title %}Log in — NO FLAGRA{% endblock %}
{% block content %}
<form class="card" method="post">
  <h1>Log in</h1>

  <label for="email">Email</label>
  <input id="email" name="email" type="email" value="{{ email or '' }}" required autofocus>

  <label for="password">Password</label>
  <input id="password" name="password" type="password" required>

  <button class="btn btn-primary" type="submit">Log in</button>

  <p class="hint">New here? <a href="{{ url_for('auth.signup') }}">Start your gym</a></p>
</form>
{% endblock %}
