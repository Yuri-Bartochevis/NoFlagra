{% extends "base.html" %}
{% block title %}{{ t('login_title') }} — NO FLAGRA{% endblock %}
{% block content %}
<form class="card" method="post">
  <h1>{{ t('login_title') }}</h1>

  <label for="email">{{ t('label_email') }}</label>
  <input id="email" name="email" type="email" value="{{ email or '' }}" required autofocus>

  <label for="password">{{ t('label_password') }}</label>
  <input id="password" name="password" type="password" required>

  <button class="btn btn-primary" type="submit">{{ t('btn_login') }}</button>

  <p class="hint">{{ t('hint_new_here') }} <a href="{{ url_for('auth.signup') }}">{{ t('nav_start_gym') }}</a></p>
</form>
{% endblock %}
