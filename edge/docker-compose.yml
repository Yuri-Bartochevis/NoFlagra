services:
  frigate:
    container_name: frigate
    image: ghcr.io/blakeblackshear/frigate:0.17.2   # pinned: 0.15 changed the record schema
    restart: unless-stopped
    shm_size: "128mb"
    volumes:
      # Mount the whole directory, not just config.yml - Frigate writes
      # frigate.db and .jwt_secret in here and they must survive a restart.
      - ./frigate:/config
      - ./storage:/media/frigate
      - /etc/localtime:/etc/localtime:ro
    tmpfs:
      # Recording segments land here before being written to disk. On disk it
      # wears out a Pi's SD card fast.
      - /tmp/cache:size=1000000000
    ports:
      - "5000:5000"   # unauthenticated internal API - do NOT expose to the internet
      - "8971:8971"   # authenticated UI
      - "8554:8554"   # RTSP restream (optional)

  receiver:
    container_name: gir-receiver
    build: ./receiver
    restart: unless-stopped
    ports:
      - "5001:5001"
    volumes:
      # read-only: the continuous recording belongs to Frigate. We only read
      # it to measure how fast it grows.
      - ./storage:/media/frigate:ro
      # ...but exports are ours to manage, so that one path is writable.
      # A nested mount overrides the :ro above for this subtree only.
      - ./storage/exports:/media/frigate/exports
      # writable: cached preview images, regenerated if deleted
      - ./thumbs:/thumbs
      # writable: settings the manage page edits, and the keep-list
      - ./data:/data
    environment:
      RECEIVER_SECRET: "${RECEIVER_SECRET:?set RECEIVER_SECRET in .env}"
      # Password for deleting clips and changing settings. Unset falls back to
      # RECEIVER_SECRET — which is baked into the ESP32 firmware, so set it.
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      FRIGATE_URL: "http://frigate:5000"
      CAMERA_NAME: "mat_camera"
      # These three are defaults only. Once the manage page saves them they
      # live in data/settings.json, which wins from then on.
      LOOKBACK_SECONDS: "600"
      POST_ROLL_SECONDS: "15"
      COOLDOWN_SECONDS: "30"   # duplicate presses blocked for this long
      EXPORTS_DIR: "/media/frigate/exports"
      RECORDINGS_DIR: "/media/frigate/recordings"
      THUMBS_DIR: "/thumbs"
      DATA_DIR: "/data"
      # Mirrors record.continuous.days in frigate/config.yml. Display only —
      # keep the two in step by hand.
      FRIGATE_RETENTION_DAYS: "3"
      PAGE_SIZE: "12"          # clips loaded per page
    depends_on:
      - frigate

