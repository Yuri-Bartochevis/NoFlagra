name: Publish landing page

# Builds the static marketing site with cloud/freeze.py and publishes it to
# GitHub Pages. Enable it once under Settings -> Pages -> Source: GitHub
# Actions; the "deploy from a branch" option can't reach cloud/dist.
#
# Only the public landing page is published. Signup, login and /app need
# Flask + Postgres — set the APP_BASE_URL repository variable to a real
# deployment and those links will point at it instead of the quote anchor.

on:
  push:
    branches: [main]
    paths:
      - "cloud/app/templates/**"
      - "cloud/app/static/**"
      - "cloud/app/blueprints/public.py"
      - "cloud/app/i18n.py"
      - "cloud/app/legal.py"
      - "cloud/app/__init__.py"
      - "cloud/freeze.py"
      - "cloud/requirements.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloud/requirements.txt

      - run: pip install -r requirements.txt

      # og:image has to be an absolute URL a scraper can actually fetch, so
      # it points at Pages rather than the app — previews then keep working
      # even when a free-tier web service is asleep. The owner is lowercased
      # because github.repository_owner keeps its original casing while the
      # Pages hostname is always lower case.
      - name: Work out the site origin
        run: |
          if [ -n "${{ vars.SITE_URL }}" ]; then
            echo "SITE_URL=${{ vars.SITE_URL }}" >> "$GITHUB_ENV"
          else
            owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            echo "SITE_URL=https://$owner.github.io/${{ github.event.repository.name }}" >> "$GITHUB_ENV"
          fi

      - name: Freeze the landing page
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
        run: python3 freeze.py

      - name: Fail if the build came out empty
        run: |
          for page in index en/index sobre/index privacidade/index termos/index; do
            test -s "dist/$page.html" || { echo "missing dist/$page.html"; exit 1; }
          done
          test -s dist/static/mat-demo.mp4
          test -s dist/static/og.jpg

      - uses: actions/upload-pages-artifact@v3
        with:
          path: cloud/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
